<!DOCTYPE html>
<html>
    <head>
        <title>My super hero card</title>
        <style>

            /*Typography - font, size, weight, color for the whole <page>*/
                body {
                background-color: darkblue;
                color: white;
                font-family: Arial, sans serif;
            }

            /*Typography + Text shadow - big bold title with an orange <shadow>*/
            .hero name {
            font-size: 60px;
            font-weight:bold;
            color: yellow;
            text-shadow: 3px 3px orange;
            }
.tagline {
    font-size; italic; 
    color:lightblue;
    text-transform: capitalise;
}
.label {
    text-transform: uppercase;
    text-decoration:underline;
    color: coral; 
}
.power {
    font-weight: bold;
    color:lightgreen;
}
.weakness {
    text-decoration: line-through;
    color: gray;
}

.badge {

font-size: 28px;

font-weight: bold;

color: gold;

transform: rotate(15deg);

}

/* Typography — footer text */

.made-by {

color: coral;

font-style: italic;

}

</style>

</head>

<body>

<h1 class="hero-name">Thunder Kid</h1>

<p class="tagline">the most powerful hero in the school</p>

<h2 class="label">super powers</h2>

<p class="power">Can run faster than a cheetah</p>

<p class="power">Can lift a school bus</p>

<h2 class="label">weaknesses</h2>

<p class="weakness">Maths homework</p>

<p class="weakness">Broccoli</p>

<p class="badge">Top Hero</p>

<p class="made-by">Created by ___________</p>

</body>

</html>
